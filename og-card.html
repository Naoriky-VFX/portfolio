<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body { position:relative; background:#03060d; font-family:"Segoe UI", system-ui, sans-serif; }
  .bg { position:absolute; inset:0;
    background:
      radial-gradient(60% 80% at 78% 10%, rgba(41,215,255,.20), transparent 65%),
      radial-gradient(55% 70% at 12% 95%, rgba(168,85,247,.20), transparent 65%),
      linear-gradient(120deg,#050a14 0%,#071528 55%,#03060d 100%); }
  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(120,170,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.10) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(80% 80% at 60% 40%, #000 10%, transparent 80%);
    mask-image:radial-gradient(80% 80% at 60% 40%, #000 10%, transparent 80%); }
  .ring { position:absolute; width:760px; height:760px; right:-220px; top:-260px; border-radius:50%;
    border:1px solid rgba(41,215,255,.28); box-shadow:0 0 0 60px rgba(41,215,255,.03), 0 0 0 130px rgba(41,215,255,.02); }
  .wrap { position:relative; display:flex; align-items:center; gap:54px; height:100%; padding:0 72px; }
  .photo { width:190px; height:190px; border-radius:50%; object-fit:cover;
    border:1px solid rgba(41,215,255,.5); box-shadow:0 0 0 8px rgba(41,215,255,.07), 0 24px 60px rgba(0,0,0,.6); }
  .txt { min-width:0; }
  .eyebrow { display:inline-block; padding:7px 16px; border:1px solid rgba(41,215,255,.35); border-radius:999px;
    color:#9fd8ff; font:11px "Consolas",monospace; letter-spacing:.26em; text-transform:uppercase; }
  h1 { margin:20px 0 0; font-size:66px; line-height:.96; letter-spacing:-.03em; font-weight:800;
    background:linear-gradient(100deg,#eaf7ff 0%,#7fd0ff 30%,#b79bff 62%,#eaf7ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:16px; font-size:24px; color:#cfe2ff; }
  .small { margin-top:10px; font-size:17px; color:#8aa2c0; }
  .tags { display:flex; gap:10px; margin-top:26px; }
  .tags span { padding:8px 14px; border:1px solid rgba(150,190,240,.28); border-radius:999px;
    color:#a9c4e6; font:11px "Consolas",monospace; letter-spacing:.14em; text-transform:uppercase; }
  .foot { position:absolute; left:72px; bottom:34px; right:72px; display:flex; justify-content:space-between;
    color:#7f93ad; font:12px "Consolas",monospace; letter-spacing:.14em; text-transform:uppercase; }
  .foot b { color:#29d7ff; font-weight:600; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="ring"></div>
  <div class="wrap">
    <img class="photo" src="assets/fotoperfil.jpg" alt="">
    <div class="txt">
      <span class="eyebrow">Evandro Tavares</span>
      <h1>Software que<br>trabalha sozinho.</h1>
      <p class="sub">Full Stack Developer &amp; AI Engineer</p>
      <p class="small">Bots · Painéis · Apps · Automação com IA</p>
      <div class="tags"><span>Agents</span><span>LLM</span><span>APIs</span><span>BSPA-OM</span></div>
    </div>
  </div>
  <div class="foot"><span><b>NET&amp;TEC</b> INFORM@TIC@</span><span>portfolio.programer.site</span></div>
</body>
</html>
